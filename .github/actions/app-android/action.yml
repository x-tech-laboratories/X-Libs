name: X-app Android build
description: Builds an X-app's Android package in its flake's Android shell, keeps it as the run's artifact, and publishes it as a GitHub release from a version tag, as the Application Standard asks.

inputs:
  keystore-base64:
    description: The release keystore, base64-encoded, from the repository's secrets. A build without it stays unsigned; a version tag needs it.
    default: ""
  keystore-password:
    description: The keystore's password, which is also the key's.
    default: ""
  key-alias:
    description: The key's alias in the keystore.
    default: ""
  github-token:
    description: The token that publishes the release, which needs contents write permission on a version tag.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: cachix/install-nix-action@v31
    - name: Build the release APK
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ANDROID_VERSION_CODE: ${{ github.run_number }}
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release-keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
        elif [ "$GITHUB_REF_TYPE" = tag ]; then
          echo "::error::A release needs the keystore-base64, keystore-password and key-alias inputs."
          exit 1
        fi
        # A tag names the build after itself; any other build is the package's version and its commit.
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
        else
          export ANDROID_VERSION_NAME="$(jq -r .version package.json)-${GITHUB_SHA::7}"
        fi
        nix develop ./nix#android --command bash -c 'npm ci && npm run build:android && cd android && ./gradlew assembleRelease --no-daemon'
        apk="$(jq -r .name package.json).apk"
        cp android/app/build/outputs/apk/release/app-release*.apk "$apk"
        echo "APK=$apk" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      with:
        name: android
        path: ${{ env.APK }}
    # A version tag such as v1.2.3 publishes the package as a GitHub release, which Obtainium follows.
    - name: Publish the release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
          --title "$(jq -r .appName capacitor.config.json) ${GITHUB_REF_NAME#v}" --generate-notes
