version: 2
updates:
  # Keeps the Halon dev and peer dependency on its latest release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@x-tech-laboratories/halon"
    # Our own releases skip the default 3-day cooldown, which X-Libs outpaces several times a day.
    cooldown:
      exclude: ["@x-tech-laboratories/*"]
